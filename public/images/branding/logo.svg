<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4C" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Emblem Shield -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield with Glow -->
    <path d="M50 0 C75 0 95 12 95 38 C95 72 50 96 50 96 C50 96 5 72 5 38 C5 12 25 0 50 0 Z" 
          fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(11,31,76,0.2))" />
    
    <!-- Inner Shield Border -->
    <path d="M50 6 C70 6 88 16 88 38 C88 66 50 88 50 88 C50 88 12 66 12 38 C12 16 30 6 50 6 Z" 
          fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8" />
    
    <!-- Radiance / Rising Sun -->
    <path d="M50 28 L42 16 M50 28 L50 14 M50 28 L58 16 M50 28 L35 22 M50 28 L65 22" 
          stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="50" cy="28" r="4.5" fill="url(#goldGrad)" />
    
    <!-- Open Book -->
    <path d="M50 56 C44 51 34 50 24 53 L24 67 C34 64 44 65 50 70 C56 65 66 64 76 67 L76 53 C66 50 56 51 50 56 Z" 
          fill="#FFFFFF" />
    <path d="M50 56 L50 70" stroke="#0B1F4C" stroke-width="1.8" />

    <!-- IIT Atom Orbit Ring -->
    <ellipse cx="50" cy="46" rx="28" ry="10" 
             fill="none" stroke="url(#accentGrad)" stroke-width="1.8" 
             transform="rotate(-20 50 46)" opacity="0.9" />
  </g>

  <!-- Typography -->
  <!-- Institution Main Title -->
  <text x="125" y="46" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#0B1F4C" letter-spacing="0.5">
    VIDYARTHI BHAVAN
  </text>
  
  <!-- Subtitle: IIT ACADEMY -->
  <rect x="126" y="58" width="180" height="24" rx="4" fill="#1D4ED8" />
  <text x="216" y="75" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">
    IIT ACADEMY
  </text>
  
  <!-- Verified Location & Nation Building Motto -->
  <text x="320" y="75" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#2563EB" letter-spacing="1">
    • NARASANNAPETA
  </text>
  <text x="126" y="98" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="0.5">
    BUILDING THE REAL PILLARS OF BHARAT
  </text>
</svg>
